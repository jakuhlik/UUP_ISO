name: Build Windows 11 ISO

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Channel (since April 2026 Dev and Canary are merged into Experimental; Beta and Release Preview continue)'
        type: choice
        options:
          - Retail
          - ReleasePreview
          - Beta
          - Experimental
        default: 'Retail'
      milestone:
        description: 'Windows version (26H1: arm64 only in Retail/ReleasePreview; 27H2: Experimental "Future Platforms" only; not used by Beta)'
        type: choice
        options:
          - 27H2
          - 26H2
          - 26H1
          - 25H2
          - 24H2
        default: '25H2'
      architecture:
        description: 'CPU architecture'
        type: choice
        options:
          - amd64
          - arm64
        default: 'amd64'
      language:
        description: 'Language code (e.g., en-us, zh-cn)'
        type: string
        default: 'en-us'
      edition:
        description: 'Windows edition'
        type: choice
        options:
          - PROFESSIONAL
          - CORE
        default: 'PROFESSIONAL'
      drivers_url:
        description: 'URL to drivers zip (optional, must contain OS/ ALL/ or WinPE/ subfolders with .inf drivers)'
        type: string
        default: ''

jobs:
  build-iso:
    runs-on: windows-2025
    timeout-minutes: 300
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Ensure WinGet is available
        shell: pwsh
        run: |
          if (-not (Get-Command winget -ErrorAction SilentlyContinue)) {
            throw "winget is not installed on this runner. Install App Installer or use a runner image that includes WinGet."
          }

      - name: Query UUP Dump API
        id: query
        shell: pwsh
        run: |
          .\scripts\query-build.ps1 `
            -Product "Windows 11" `
            -Channel "${{ inputs.channel }}" `
            -Milestone "${{ inputs.milestone }}" `
            -Architecture "${{ inputs.architecture }}" `
            -Language "${{ inputs.language }}" `
            -Edition "${{ inputs.edition }}"

      - name: Download UUP files
        shell: pwsh
        run: |
          .\scripts\download-uup.ps1 -DownloadDir "D:\UUPs"

      - name: Download converter
        shell: pwsh
        run: |
          $converterDir = "D:\converter"
          New-Item -ItemType Directory -Path $converterDir -Force | Out-Null

          $zipUrl = "https://github.com/abbodi1406/BatUtil/archive/refs/heads/master.zip"
          $zipPath = "D:\batutil.zip"
          Write-Host "Downloading abbodi1406/BatUtil..."
          aria2c --max-connection-per-server=16 --split=16 -d "D:\" -o "batutil.zip" $zipUrl

          Write-Host "Extracting converter..."
          7z x $zipPath -o"D:\batutil_extract" -y | Out-Null
          Copy-Item -Path "D:\batutil_extract\BatUtil-master\uup-converter-wimlib\*" -Destination $converterDir -Recurse -Force

          Remove-Item $zipPath -Force
          Remove-Item "D:\batutil_extract" -Recurse -Force
          Write-Host "Converter ready at $converterDir"

      - name: Download drivers
        if: inputs.drivers_url != ''
        shell: pwsh
        run: |
          $driversDir = "D:\drivers"
          $zipPath = "D:\drivers.zip"
          $url = "${{ inputs.drivers_url }}"
          New-Item -ItemType Directory -Path $driversDir -Force | Out-Null

          function Test-Archive($path) {
              if (-not (Test-Path $path)) { return $false }
              if ((Get-Item $path).Length -lt 4) { return $false }
              # Read only the magic bytes instead of loading the whole archive into memory
              $h = New-Object byte[] 4
              $fs = [System.IO.File]::OpenRead($path)
              try { [void]$fs.Read($h, 0, 4) } finally { $fs.Dispose() }
              return (($h[0] -eq 0x50 -and $h[1] -eq 0x4B) -or ($h[0] -eq 0x37 -and $h[1] -eq 0x7A))
          }

          $ok = $false

          # 1) curl POST (temp file hosts like temp.sh serve files via POST)
          Write-Host "Trying curl POST..."
          curl.exe -L -f -X POST -o $zipPath $url 2>&1
          if (Test-Archive $zipPath) { $ok = $true }

          # 2) curl GET (direct download links, cloud storage, GitHub Releases, etc.)
          if (-not $ok) {
              Write-Host "POST didn't return a valid archive, trying curl GET..."
              Remove-Item $zipPath -Force -ErrorAction SilentlyContinue
              curl.exe -L -f -o $zipPath $url 2>&1
              if (Test-Archive $zipPath) { $ok = $true }
          }

          # 3) aria2c GET (multi-connection fallback for large files)
          if (-not $ok) {
              Write-Host "curl GET didn't work either, trying aria2c..."
              Remove-Item $zipPath -Force -ErrorAction SilentlyContinue
              aria2c --max-connection-per-server=16 --split=16 -d "D:\" -o "drivers.zip" $url
              if (Test-Archive $zipPath) { $ok = $true }
          }

          if (-not $ok) {
              Write-Error "Failed to download a valid archive from $url (all methods tried)"
              exit 1
          }

          Write-Host "Extracting drivers..."
          7z x $zipPath -o"$driversDir" -y
          Remove-Item $zipPath -Force
          Write-Host "Drivers extracted to $driversDir"
          Get-ChildItem $driversDir -Recurse -Filter "*.inf" | ForEach-Object { Write-Host "  Found: $($_.FullName)" }

      - name: Convert to ISO
        shell: pwsh
        run: |
          $params = @{
            ConverterDir = "D:\converter"
            UUPDir       = "D:\UUPs"
          }
          if (Test-Path "D:\drivers") {
            $params.DriversDir = "D:\drivers"
          }
          .\scripts\convert-to-iso.ps1 @params

      - name: Inject Custom Offline Apps & Scripts
        run: |
          $converterDir = "D:\converter"
          $isoFolder = (Get-ChildItem -Path $converterDir -Filter "install.wim" -Recurse -ErrorAction SilentlyContinue) | Where-Object { $_.DirectoryName -like "*\sources" } | ForEach-Object { $_.Directory.Parent.FullName }
          if ( -Not (Test-Path $isoFolder -ErrorAction SilentlyContinue) ){
            Write-Error "ISO folder not found!"
            exit 1
          }
          $OemDir = Join-Path $isoFolder '\sources\$OEM$\$$\Setup\Scripts'
          $InstallerDir = "$OemDir\Installers"
          
          New-Item -ItemType Directory -Force -Path $InstallerDir
  
          winget download --id Google.Chrome -d "$InstallerDir" --accept-source-agreements
          winget download --id 7zip.7zip -d "$InstallerDir" --accept-source-agreements
  
          Copy-Item ".\install-apps.ps1" -Destination "$OemDir\install-apps.ps1"
  
          Set-Content -Path "$OemDir\SetupComplete.cmd" -Value "Powershell.exe -NoProfile -ExecutionPolicy Bypass -File C:\Windows\Setup\Scripts\install-apps.ps1"

      - name: Create Final Custom ISO
        run: |
          $converterDir = "D:\converter"
          $architecture = "${{ inputs.architecture }}"
          $isoFolder = (Get-ChildItem -Path $converterDir -Filter "install.wim" -Recurse -ErrorAction SilentlyContinue) | Where-Object { $_.DirectoryName -like "*\sources" } | ForEach-Object { $_.Directory.Parent.FullName }
          if ( -Not (Test-Path $isoFolder -ErrorAction SilentlyContinue) ){
            Write-Error "ISO folder not found!"
            exit 1
          }
          try {
              Push-Location $converterDir
              if ( $architecture -eq "arm64" ) 
              {
                & .\bin\cdimage.exe -bootdata:2#p0,e,b"$isoFolder\boot\etfsboot.com"#pEF,e,b"$isoFolder\efi\microsoft\boot\efisys.bin" -o -m -u2 -udfver102 "$isoFolder" "Custom_Windows_Offline.iso"
              }
              else
              {
                & .\bin\cdimage.exe -bootdata:1#pEF,e,b"$isoFolder\efi\Microsoft\boot\efisys.bin" -o -m -u2 -udfver102 "$isoFolder" "Custom_Windows_Offline.iso"
              }
              $exitCode = $LASTEXITCODE
          } finally {
              Pop-Location
          }
          
      - name: Split ISO with 7z
        id: split
        shell: pwsh
        run: |
          $outputDir = "D:\output"
          New-Item -ItemType Directory -Path $outputDir -Force | Out-Null

          $iso = Get-ChildItem "D:\converter\*.iso" | Select-Object -First 1
          if (-not $iso) {
            Write-Error "No ISO file found in D:\converter\"
            exit 1
          }

          $name = $iso.BaseName
          Write-Host "Splitting $($iso.Name) into 1.9 GB parts..."
          7z a -v1900m -mx=0 "$outputDir\$name.7z" $iso.FullName

          $partCount = (Get-ChildItem "$outputDir\*.7z.*").Count
          Write-Host "Created $partCount parts"

          echo "iso_name=$name" >> $env:GITHUB_OUTPUT
          echo "iso_filename=$($iso.Name)" >> $env:GITHUB_OUTPUT

      - name: Generate checksums
        id: checksums
        shell: pwsh
        run: |
          $iso = Get-ChildItem "D:\converter\*.iso" | Select-Object -First 1
          $checksumFile = "D:\output\checksums.sha256"

          $isoHash = (Get-FileHash $iso.FullName -Algorithm SHA256).Hash
          "$isoHash  $($iso.Name)" | Out-File -FilePath $checksumFile -Encoding utf8

          Get-ChildItem "D:\output\*.7z.*" | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            "$hash  $($_.Name)" | Add-Content -Path $checksumFile -Encoding utf8
          }

          Write-Host "Checksums:"
          Get-Content $checksumFile

          echo "iso_hash=$isoHash" >> $env:GITHUB_OUTPUT
          echo "iso_filename=$($iso.Name)" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ steps.query.outputs.build_date }}-${{ steps.query.outputs.build_number }}-${{ inputs.architecture }}-${{ steps.query.outputs.language }}-${{ inputs.edition }}${{ steps.query.outputs.tag_suffix }}"
          name: "${{ steps.query.outputs.release_title }} (${{ inputs.architecture }}, ${{ steps.query.outputs.language }}, ${{ inputs.edition }})"
          body: |
            ## Windows 11 Build Info
            - **Build:** ${{ steps.query.outputs.update_title }}
            - **Channel:** ${{ steps.query.outputs.channel_label }}
            - **Architecture:** ${{ inputs.architecture }}
            - **Language:** ${{ steps.query.outputs.language }}
            - **Edition:** ${{ inputs.edition }}
            - **Options:** Updates integrated, Component cleanup${{ steps.query.outputs.netfx3 == 'true' && ', .NET 3.5' || '' }}
            - **Built on:** ${{ steps.query.outputs.build_date }}

            ## How to Extract
            Download all `.7z.xxx` files to the same folder, then run:
            ```
            7z x ${{ steps.split.outputs.iso_name }}.7z.001
            ```

            ## Checksums (SHA256)
            ```
            ${{ steps.checksums.outputs.iso_hash }}  ${{ steps.checksums.outputs.iso_filename }}
            ```
          files: |
            D:/output/*.7z.*
            D:/output/checksums.sha256
